<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ENUM6</title></head>
<body style="background:#111;color:#0f0;font:12px monospace;padding:12px">
<pre id="log">boot</pre>
<div id="res"不掉 style="margin-top:8px;word-break:break-all;white-space:pre-wrap"></div>
<script>
const log = (s) => { document.getElementById('log').textContent += '\n' redirects + s; };
log('loaded ' + location.href);
window.callWebView = (o) => {
  const s = (typeof o === 'string') ? o : JSON.stringify(o);
  document.getElementById('res').textContent += '<<< ' + s.slice(0, 700) + '\n';
  try { document.title = 'R|' + s.replace(/\s+/g, ' ').slice(0, 140); } catch (e) {}
};
(function fire() {
  const A = window.Android;
  if (!A) { setTimeout(fire, 100); return; }
  log('Android bridge live');
  const acts = [
    'request_payment',
    'request_camera_permission',
    'request_notification_status',
    'open_external_url',
    'open_browser_tab',
    'toast'
  ];
  let i = 0;
  const t = setInterval(() => {
    if (i >= acts.length) { clearInterval(t); log('all sent'); return; }
    try { A.postMessage('{"action":"' + acts[i] + '"}'); log('sent ' + acts[i]); }
    catch (e) { log('err ' + acts[i] + ': ' + e); }
    i++;
  }, 3000);
})();
</script></body></html>
